{% extends "base.html" %}
{% block title %}Account{% endblock %}
{% block main_class %}narrow{% endblock %}
{% block content %}
<div class="card">
  <h1>{{ name }}</h1>
  <p class="muted">Role {{ user.role or 'admin' }} - last sign-in {{ user.last_login or '-' }}</p>
  {% if error %}<div class="flash warn">{{ error }}</div>{% endif %}
  <form method="post">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <label>Current password <input type="password" name="current" required autocomplete="current-password"></label>
    <label>New password <small class="muted">(at least {{ min_len }} characters)</small>
      <input type="password" name="password" minlength="{{ min_len }}" required autocomplete="new-password"></label>
    <label>Confirm new password <input type="password" name="confirm" minlength="{{ min_len }}" required autocomplete="new-password"></label>
    <button class="primary">Change password</button>
  </form>
</div>
{% endblock %}
