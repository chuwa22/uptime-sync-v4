{% extends "base.html" %}
{% block title %}{{ name }}{% endblock %}
{% block content %}
<div class="head">
  <div class="head-title"><h1>{{ name }}</h1><p class="sub">Newest first, last 400 lines</p></div>
  <a class="button" href="{{ url_for('logs') }}">{{ icon('back') }}Logs</a>
</div>
<div class="card flush">
  <pre class="log">{% for line in lines %}{{ line }}
{% else %}Empty.{% endfor %}</pre>
</div>
{% endblock %}
