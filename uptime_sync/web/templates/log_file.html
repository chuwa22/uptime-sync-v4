{% extends "base.html" %}
{% block title %}{{ name }}{% endblock %}
{% block content %}
<div class="head"><h1>{{ name }}</h1><a href="{{ url_for('logs') }}">&larr; Logs</a></div>
<div class="card flush">
  <pre class="log">{% for line in lines %}{{ line }}
{% else %}Empty.{% endfor %}</pre>
</div>
<p class="muted small">Newest first, last 400 lines.</p>
{% endblock %}
