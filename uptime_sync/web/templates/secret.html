{% extends "base.html" %}
{% block title %}New secret{% endblock %}
{% block main_class %}narrow{% endblock %}
{% block content %}
<div class="card">
  <h1>New HMAC secret</h1>
  <p>Copy it now - it is not shown again. Paste it on this agent's card in uptime-monitor (key button).</p>
  <input class="mono secret" value="{{ secret }}" readonly data-select-on-focus>
  <div class="actions"><a class="button primary" href="{{ url_for('settings_page') }}">Done</a></div>
</div>
{% endblock %}
